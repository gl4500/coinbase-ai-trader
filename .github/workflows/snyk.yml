# ── Snyk dependency scan (SCA) — periodic and advisory ──────────────────────────
#
# Operator decision 2026-11-20 ("option A"): the free plan's monthly test quota cannot
# absorb a scan on every push, so Snyk runs here instead of in ci.yml:
#   * weekly (Monday 06:00 UTC), and on demand (workflow_dispatch);
#   * on pull requests to main that change a dependency manifest or this file.
# It is ADVISORY: not part of the ci.yml Security gate and not a required check, so a
# high-severity finding reports here but does not block merge.
#
# This covers `snyk test` (Open Source / SCA) only. The external `code/snyk` commit status
# is Snyk Code from Snyk's GitHub integration, with its own quota; it is configured in the
# Snyk dashboard, not by any workflow.
#
# No-op (concludes success, summary says "not scanned") until a SNYK_TOKEN repo secret is
# configured. Get a token at snyk.io -> Account -> Auth Token, then add it under
# Settings -> Secrets and variables -> Actions -> SNYK_TOKEN.

name: Snyk — dependency scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/requirements*.txt"
      - "backend/.snyk"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/.snyk"
      - ".github/workflows/snyk.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION:   "20"

jobs:
  snyk:
    name: Snyk (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SNYK_TOKEN present
        id: tok
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN not set — skipping Snyk. Add the secret to enable."
            echo "### Snyk: not scanned (SNYK_TOKEN is not set)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.tok.outputs.present == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        if: steps.tok.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: snyk/actions/setup@master
        if: steps.tok.outputs.present == 'true'
      - name: Snyk — backend (Python SCA)
        if: steps.tok.outputs.present == 'true'
        working-directory: backend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # Install deps into the job interpreter FIRST, then run Snyk from the
        # backend dir so its pip plugin resolves against the installed graph
        # (the setup-python interpreter is the default `python`). Without an
        # installed, resolvable graph Snyk's pip plugin errors
        # (SNYK-OS-PYTHON-0013) or under-reports — the previous run-from-root
        # `--file=backend/requirements.txt` form gave a false green.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          snyk test \
            --package-manager=pip \
            --file=requirements.txt \
            --severity-threshold=high
      - name: Snyk — frontend (Node SCA)
        if: steps.tok.outputs.present == 'true'
        working-directory: frontend
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        # Use `npm install` (not `npm ci`) to match the frontend-typecheck /
        # frontend-build jobs: the committed lock file has known cross-platform
        # esbuild drift, and `npm ci` aborts on any lock/package.json mismatch.
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          snyk test --severity-threshold=high
