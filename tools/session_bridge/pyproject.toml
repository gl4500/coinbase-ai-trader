[project]
name = "session_bridge"
version = "0.1.0"
description = "CrewAI Flow mailbox connecting existing Claude and Codex sessions"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai==1.15.22", "mcp==1.28.1"]

[project.scripts]
kickoff = "session_bridge.main:kickoff"
plot = "session_bridge.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "9f37f97e-15a8-42ec-9d7c-1dabb83f7677"
